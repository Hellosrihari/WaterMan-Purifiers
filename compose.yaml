services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: waterman
      POSTGRES_USER: waterman
      POSTGRES_PASSWORD: waterman
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterman -d waterman"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
